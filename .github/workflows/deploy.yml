name: Deploy su Altervista

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Carica tema child
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/themes/blocksy-child/
          server-dir: /themes/blocksy-child/
          state-name: deploy-tema-v3.yml

      - name: Carica plugin NabhaWorks Core
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/plugins/nabhaworks-core/
          server-dir: /plugins/nabhaworks-core/
          state-name: deploy-plugin-v3.yml

      - name: Carica plugin NabhaWorks Layout
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/plugins/nabhaworks-layout/
          server-dir: /plugins/nabhaworks-layout/
          state-name: deploy-layout-v1.yml
